name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: moon version --all
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: moon fmt --check
      - run: python scripts/test-cli.py
      - run: python scripts/test-extended.py
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon info
      - run: git diff --exit-code
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - run: python scripts/test-differential.py
      - run: python scripts/test-interop.py
      - run: python scripts/test-consumer.py
      - run: python scripts/build-web.py
      - run: npm ci --prefix tests/browser --ignore-scripts
      - run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tests/browser/test.mjs
      - run: python scripts/verify-browser-images.py
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
