<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoonDataMatrix · 本地编解码工具</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#172b36;background:#f3f6f5}body{max-width:1100px;margin:48px auto;padding:0 24px}header{margin-bottom:32px}h1{font-size:36px;margin-bottom:8px}header p{color:#53616c}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;padding:28px;border:1px solid #d7e1df;border-radius:16px}label{display:block;margin:16px 0 8px;font-weight:600}textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #8caaa5;border-radius:8px;font:inherit}textarea{min-height:180px;resize:vertical}button,a.download{display:inline-block;border:0;border-radius:8px;background:#175e52;color:white;padding:12px 18px;margin:12px 8px 0 0;font:inherit;cursor:pointer;text-decoration:none}.examples button{background:#e6f0ed;color:#175e52;font-size:14px}#preview{height:300px;display:grid;place-items:center;overflow:auto}#preview svg{max-width:100%;max-height:100%;width:280px;height:280px}#error{color:#a12424;min-height:24px}#meta{color:#53616c}button:disabled{opacity:.4;cursor:default}footer{font-size:14px;color:#53616c;margin-top:28px}a{color:#175e52}@media(max-width:720px){main{grid-template-columns:1fr}body{margin-top:20px}}
</style>
<header><h1>MoonDataMatrix</h1><p>生成与解码 Data Matrix，支持 GS1、DMRE、多字符集和多符号消息。所有处理均在你的浏览器内完成。</p></header>
<main><section><label for="kind">输入类型</label><select id="kind"><option value="text">文本 · UTF-8 / ECI 26</option><option value="hex">二进制 · 十六进制</option><option value="gs1">GS1 元素串</option><option value="eci">文本 · 指定字符集</option><option value="split">文本 · 自动分片</option><option value="message">高级消息 JSON</option><option value="matrix">解码矩阵 JSON</option><option value="assemble">重组符号集合 JSON</option></select><label for="eci">文本字符集</label><select id="eci"></select><label for="input">内容</label><textarea id="input" spellcheck="false">样本编号：LAB-2026-001</textarea><label for="shape">符号形状</label><select id="shape"><option value="square">自动方形</option><option value="rectangle">自动矩形</option><option value="any">全部经典尺寸</option><option value="dmre">自动 DMRE</option><option value="all">经典与 DMRE</option><option value="fixed">指定尺寸</option></select><label for="size">固定尺寸（宽 × 高）</label><select id="size" disabled></select><button id="generate">生成</button><div class="examples"><button data-example="0">资产编号</button><button data-example="1">中文样本</button><button data-example="2">二进制内容</button><button data-example="3">GS1 商品批次</button><button data-example="4">DMRE 设备标签</button><button data-example="5">多字符集</button><button data-example="6">多符号消息</button></div></section>
<section><h2>预览</h2><label for="symbol">当前符号</label><select id="symbol" disabled></select><div id="preview"></div><p id="meta"></p><p id="error" role="alert"></p><button id="svg" disabled>下载 SVG</button><button id="png" disabled>下载 PNG</button><button id="json" disabled>下载矩阵 JSON</button><h3>还原内容</h3><p id="decoded-text" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto"></p><details><summary>查看原始字节与控制信息</summary><pre id="decoded" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto"></pre></details><p>黑白输出 · 两模块静区 · PNG 每模块 8 像素</p></section></main>
<footer><a href="licenses/README.txt">开源许可证与来源</a></footer><script type="module" src="app.js"></script></html>
